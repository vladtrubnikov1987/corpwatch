services:
  db:
    image: mariadb:11
    container_name: corpwatch_db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: corpwatch
      MYSQL_USER: corpwatch_user
      MYSQL_PASSWORD: corpwatch_password

    ports:
      - "3306:3306"

    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    container_name: corpwatch_app
    command: python main.py
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./logs:/app/logs

    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    container_name: corpwatch_worker
    command: python worker.py
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./logs:/app/logs

    depends_on:
      db:
        condition: service_healthy

  ai_assistant:
    build: .
    container_name: corpwatch_ai_assistant
    command: python ai_assistant.py
    restart: unless-stopped

    env_file:
      - .env

    environment:
      CORPWATCH_API_URL: http://app:8000
      OLLAMA_API_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      AI_ASSISTANT_HOST: 0.0.0.0
      AI_ASSISTANT_PORT: 8010

    ports:
      - "8010:8010"

    volumes:
      - ./logs:/app/logs

    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
      ollama:
        condition: service_started

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8010/ai/health', timeout=5).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  telegram_bot:
    build: .
    container_name: corpwatch_telegram_bot
    command: python telegram_bot.py
    restart: unless-stopped

    env_file:
      - .env

    environment:
      AI_ASSISTANT_URL: http://ai_assistant:8010
      TELEGRAM_POLL_INTERVAL_SECONDS: 2

    volumes:
      - ./logs:/app/logs

    depends_on:
      ai_assistant:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    container_name: corpwatch_ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: corpwatch_phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: db
      PMA_PORT: 3306

    ports:
      - "8081:80"

    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  ollama_data: